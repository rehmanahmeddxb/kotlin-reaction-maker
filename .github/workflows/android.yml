name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static pipeline validation
        run: python3 tools/validate-pipeline.py

      - name: Static torch validation
        run: python3 tools/validate-torch.py

      - name: Branch integration guards (Phase 2 + Step 5)
        run: python3 tools/validate-integration.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install offline build toolchain
        shell: bash
        run: |
          set -uo pipefail
          rm -rf /tmp/ahmed-tc
          bash tools/ci-toolchain.sh 2>&1 | tee /tmp/tc-install.log
          echo "--- toolchain inventory ---" | tee -a /tmp/tc-install.log
          ls -la /tmp/ahmed-tc 2>&1 | tee -a /tmp/tc-install.log
          echo "missing: $(comm -23 <(printf '%s\n' kotlinc/bin/kotlinc android.jar android-d8.jar d8.jar apksigner.jar aapt2 | sort) <(cd /tmp/ahmed-tc && find . -maxdepth 2 | sed 's|^\./||' | sort))" | tee -a /tmp/tc-install.log

      - name: Upload toolchain log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-log
          path: /tmp/tc-install.log
          if-no-files-found: ignore

      - name: JVM regression tests (audio, viewport, layers, selection geometry)
        shell: bash
        env:
          TC_ROOT: /tmp/ahmed-tc
        run: |
          bash tools/audio-math-test/run.sh
          bash tools/viewport-fit-test/run.sh
          bash tools/layer-model-test/run.sh
          bash tools/step2-geom-check.sh

      - name: Build APK
        shell: bash
        env:
          TC_ROOT: /tmp/ahmed-tc
        run: |
          set -o pipefail
          ./build-apk.sh 2>&1 | tee /tmp/build-apk.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build-apk.log
          if-no-files-found: ignore

      # If the build dies (e.g. SIGKILL/137), surface the last phase lines and
      # the runner's memory/disk state as check annotations — they are
      # readable through the GitHub API even when log/artifact downloads fail.
      - name: Report build failure diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "runner: $(nproc) CPUs, $(free -m | awk '/Mem:/ {print $2 " MB total, " $7 " MB available"}')"
            echo "disk: $(df -h /tmp | awk 'NR==2 {print $4 " free on /tmp"}')"
            echo "--- last build phases ---"
            grep -E '^\[' /tmp/build-apk.log | tail -n 8 || true
            echo "--- tail of build output ---"
            tail -n 10 /tmp/build-apk.log || true
          } | while IFS= read -r line; do
            printf '::error title=build-diag::%s\n' "$line"
          done

      - name: Verify APK signature & contents
        shell: bash
        run: |
          java -jar /tmp/ahmed-tc/apksigner.jar verify --verbose \
            artifacts/AhmedReactionStudio-1.0.0.apk
          /tmp/ahmed-tc/aapt2 dump badging artifacts/AhmedReactionStudio-1.0.0.apk \
            | grep -E "^package|^sdkVersion|^launchable-activity"
          # launcher icon must resolve to the adaptive (colourful) icon
          /tmp/ahmed-tc/aapt2 dump badging artifacts/AhmedReactionStudio-1.0.0.apk \
            | grep -q "mipmap-anydpi-v26/ic_launcher.xml"
          # every activity class present in the dex
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('artifacts/AhmedReactionStudio-1.0.0.apk')
          dex = z.read('classes.dex')
          for n in ['SplashActivity', 'HomeActivity', 'EditorActivity',
                    'CameraActivity', 'DiagnosticsActivity', 'ScreenCaptureService']:
              assert n.encode() in dex, 'missing ' + n
          # Guard the features the app is repeatedly reported to be missing, so
          # a stale/regressed build can NEVER be published as "latest".
          #
          # NOTE: these are dex symbol names — renaming a class here without
          # updating this list is what makes this step fail. Keep them in sync
          # with the real types. (The pre-2026-09-08 list guarded RadialMenuView/
          # RadialMenus and the Sources/Mixer panel pair; the radial wheel and
          # tab panels are retired — the workspace chrome is now the full-bleed
          # sidebar studio: StudioLayoutInjector + StudioSection row kit +
          # the per-section renderers in EditorActivity.)
          features = {
              # Full-bleed canvas: the stage is contain-fit into the SAFE AREA
              # only — chrome floats over it and never shrinks it
              'setViewportInsets': 'four-side viewport API (StageView)',
              'applyViewportInsets': 'system-insets-only canvas',
              # Sidebar chrome: row kit, fit ladder, single-row timeline pill
              'StudioLayoutInjector': 'Studio workspace chrome injector',
              'StudioSection': 'sidebar section (header + collapsible body)',
              'actRow': 'sidebar labelled action row kit',
              'fitTopStrip': 'top-strip no-crop fit ladder',
              'buildTimeline': 'single-row timeline pill (transport + RECORD)',
              # The sidebar's dynamic section renderers
              'refreshSourceSection': 'SOURCE section renderer',
              'refreshAudioSection': 'AUDIO section renderer',
              'rebuildRecordSection': 'RECORD section renderer',
              'rebuildCanvasSection': 'CANVAS section renderer',
              'rebuildExportSection': 'EXPORT section renderer',
              # The LAYERS row engine + the one safe delete path
              'SourceDock': 'layer rows (drag-to-reorder Z)',
              'rebindDock': 'dock callback binding',
              'deleteSourceSafely': 'single delete path (camera + decoder teardown)',
              # the camera must be usable as a LIVE canvas source, not only as
              # a separate fullscreen recorder
              'LiveCamera': 'live camera source',
              'reconcileLiveCamera': 'camera/layer-list reconciler',
              # camera preview fit (feed inside the surface, never cut off)
              'updatePreviewTransform': 'camera preview fit',
              # P0 export/record playability: strided YUV, monotonic PTS, probe
              'YuvWriter': 'strided YUV encoder input',
              'ExportValidator': 'exported-file playability probe',
              'MonotonicPts': 'monotonic presentation timestamps',
              'CompositionRecorder': 'live composition recorder',
              'liveFrames': 'frozen live-camera frames in offline export',
              # Phase 2 canvas geometry + audio pipeline
              'ViewportFit': 'safe four-side canvas geometry',
              'panelHeight': 'measured panel budget around floating controls',
              'ClipCursor': 'master-clock clip audio cursor',
              'Limiter': 'shared audio limiter',
              'Resampler': 'sample-rate conversion',
              'MicThread': 'independent microphone capture',
              'AudioThread': 'sample-count audio encoding',
              # Studio workspace wiring that must ship
              'setFullCanvas': 'full canvas mode',
              'placeNewPip': 'deterministic PiP placement',
              'hitTest': 'topmost-first source selection',
              'TorchController': 'Step 4 hardware flashlight',
          }
          for sym, what in features.items():
              assert sym.encode() in dex, f'FEATURE MISSING FROM APK: {sym} ({what})'
          print('dex contains all activities, screen capture service, '
                'the full-bleed sidebar studio and the live camera source')
          PY

      - name: Speed check (build timing + APK stats)
        env:
          TC_ROOT: /tmp/ahmed-tc
        run: ./tools/speed-check.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AhmedReactionStudio-1.0.0-apk
          path: artifacts/AhmedReactionStudio-1.0.0.apk
          if-no-files-found: error
