name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static pipeline validation
        run: python3 tools/validate-pipeline.py

      - name: Static torch validation
        run: python3 tools/validate-torch.py

      - name: Branch integration guards (Phase 2 + Step 5)
        run: python3 tools/validate-integration.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install offline build toolchain
        shell: bash
        run: |
          set -uo pipefail
          rm -rf /tmp/ahmed-tc
          bash tools/ci-toolchain.sh 2>&1 | tee /tmp/tc-install.log
          echo "--- toolchain inventory ---" | tee -a /tmp/tc-install.log
          ls -la /tmp/ahmed-tc 2>&1 | tee -a /tmp/tc-install.log
          echo "missing: $(comm -23 <(printf '%s\n' kotlinc/bin/kotlinc android.jar android-d8.jar d8.jar apksigner.jar aapt2 | sort) <(cd /tmp/ahmed-tc && find . -maxdepth 2 | sed 's|^\./||' | sort))" | tee -a /tmp/tc-install.log

      - name: Upload toolchain log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-log
          path: /tmp/tc-install.log
          if-no-files-found: ignore

      - name: JVM regression tests (audio, viewport, chrome budget, layers, selection geometry)
        shell: bash
        env:
          TC_ROOT: /tmp/ahmed-tc
        run: |
          bash tools/audio-math-test/run.sh
          bash tools/viewport-fit-test/run.sh
          bash tools/chrome-budget-test/run.sh
          python3 tools/chrome-fit-check.py
          bash tools/layer-model-test/run.sh
          bash tools/step2-geom-check.sh

      - name: Build APK
        shell: bash
        env:
          TC_ROOT: /tmp/ahmed-tc
        run: |
          set -o pipefail
          ./build-apk.sh 2>&1 | tee /tmp/build-apk.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build-apk.log
          if-no-files-found: ignore

      # If the build dies (e.g. SIGKILL/137), surface the last phase lines and
      # the runner's memory/disk state as check annotations — they are
      # readable through the GitHub API even when log/artifact downloads fail.
      - name: Report build failure diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "runner: $(nproc) CPUs, $(free -m | awk '/Mem:/ {print $2 " MB total, " $7 " MB available"}')"
            echo "disk: $(df -h /tmp | awk 'NR==2 {print $4 " free on /tmp"}')"
            echo "--- last build phases ---"
            grep -E '^\[' /tmp/build-apk.log | tail -n 8 || true
            echo "--- tail of build output ---"
            tail -n 10 /tmp/build-apk.log || true
          } | while IFS= read -r line; do
            printf '::error title=build-diag::%s\n' "$line"
          done

      - name: Verify APK signature & contents
        shell: bash
        run: |
          java -jar /tmp/ahmed-tc/apksigner.jar verify --verbose \
            artifacts/AhmedReactionStudio-1.0.0.apk
          /tmp/ahmed-tc/aapt2 dump badging artifacts/AhmedReactionStudio-1.0.0.apk \
            | grep -E "^package|^sdkVersion|^launchable-activity"
          # launcher icon must resolve to the adaptive (colourful) icon
          /tmp/ahmed-tc/aapt2 dump badging artifacts/AhmedReactionStudio-1.0.0.apk \
            | grep -q "mipmap-anydpi-v26/ic_launcher.xml"
          # every activity class present in the dex
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('artifacts/AhmedReactionStudio-1.0.0.apk')
          dex = z.read('classes.dex')
          for n in ['SplashActivity', 'HomeActivity', 'EditorActivity',
                    'CameraActivity', 'DiagnosticsActivity', 'ScreenCaptureService']:
              assert n.encode() in dex, 'missing ' + n
          # Guard the features the app is repeatedly reported to be missing, so
          # a stale/regressed build can NEVER be published as "latest".
          #
          # NOTE: these are dex symbol names — renaming a class here without
          # updating this list is what makes this step fail. Keep them in sync
          # with the real types. (RadialWheelView/makePetal were the pre-nesting
          # names; the wheel is now RadialMenuView with addPetal. buildTabBar/
          # updateSourceStrip were the pre-redesign chrome; the workspace chrome
          # is now StudioLayoutInjector with the Sources/Mixer panel pair.)
          features = {
              # the radial menu must ship, and it must be the NESTED one:
              # Level/submenu are what make petals open sub-petals rather than
              # just firing an action and closing
              'RadialMenuView': 'radial menu view',
              'addPetal': 'radial petal bloom',
              'RadialMenus': 'the menu tree (sources/add/controls/mixing/...)',
              'submenu': 'nested sub-petals',
              # the camera must be usable as a LIVE canvas source, not only as
              # a separate fullscreen recorder
              'LiveCamera': 'live camera source',
              'reconcileLiveCamera': 'camera/layer-list reconciler',
              # camera preview fit (feed inside the surface, never cut off)
              'updatePreviewTransform': 'camera preview fit',
              # P0 export/record playability: strided YUV, monotonic PTS, probe
              'YuvWriter': 'strided YUV encoder input',
              'ExportValidator': 'exported-file playability probe',
              'MonotonicPts': 'monotonic presentation timestamps',
              'CompositionRecorder': 'live composition recorder',
              'liveFrames': 'frozen live-camera frames in offline export',
              # Phase 2 canvas geometry + audio pipeline
              'ViewportFit': 'safe four-side canvas geometry',
              'panelHeight': 'measured panel budget around floating controls',
              'ClipCursor': 'master-clock clip audio cursor',
              'Limiter': 'shared audio limiter',
              'Resampler': 'sample-rate conversion',
              'MicThread': 'independent microphone capture',
              'AudioThread': 'sample-count audio encoding',
              # Redesigned Studio workspace (PR #31): the injected chrome plus
              # the panels it hosts must ship, not the stubbed pre-redesign
              # editor methods.
              'StudioLayoutInjector': 'Studio workspace chrome injector',
              'bindPanels': 'panel listener binding',
              'buildTransport': 'transport bar builder',
              'SourcesPanel': 'source list panel',
              'MixerPanel': 'audio mixer panel',
              'PropertiesPanel': 'per-source properties tab (the advanced sheet)',
              'EffectsPanel': 'effects tab',
              'ChromeBudget': 'dp budget: canvas first, then rail / panel / optional rows',
              'TimelineView': 'model-driven clip timeline',
              'setFullCanvas': 'full canvas mode',
              'relayoutChrome': 'orientation re-layout delegation',
              'refreshContextBar': 'unified source actions',
              'placeNewPip': 'deterministic PiP placement',
              'hitTest': 'topmost-first source selection',
              'TorchController': 'Step 4 hardware flashlight',
          }
          for sym, what in features.items():
              assert sym.encode() in dex, f'FEATURE MISSING FROM APK: {sym} ({what})'
          print('dex contains all activities, screen capture service, '
                'the nested radial menu and the live camera source')
          PY

      - name: Speed check (build timing + APK stats)
        env:
          TC_ROOT: /tmp/ahmed-tc
        run: ./tools/speed-check.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AhmedReactionStudio-1.0.0-apk
          path: artifacts/AhmedReactionStudio-1.0.0.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # On-device smoke test of the Studio chrome (tools/emulator-smoke).
  #
  # The APK job above proves the chrome compiles and that the dp budget is
  # right on paper; this job runs the signed APK on a real Android window
  # (x86_64 emulator, KVM on ubuntu-latest) in the four tiers — phone /
  # tablet × portrait / landscape — and asserts from the live view
  # hierarchy what only a device can show: every control on screen and
  # ≥ 44dp, no two controls overlapping, the canvas never covered, the
  # bars each tier promises present, and the process surviving select /
  # hide / tabs / collapse / re-open / undo / redo / play / stop /
  # rotation. Screenshots + window dumps are uploaded; the pass/fail
  # report is also written to the job summary so it is readable through
  # the API when artifact downloads are blocked.
  #
  # Kept as its own job so a flaky emulator boot never blocks the APK.
  # ---------------------------------------------------------------------
  emulator-smoke:
    name: Emulator smoke (4 tiers)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the APK built above
        uses: actions/download-artifact@v4
        with:
          name: AhmedReactionStudio-1.0.0-apk
          path: artifacts

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Run the smoke test on an API 30 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_5
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          script: bash tools/emulator-smoke/smoke.sh

      - name: Upload screenshots, window dumps and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke
          path: out/emulator-smoke
          if-no-files-found: warn
